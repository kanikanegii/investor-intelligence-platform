apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: invint
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # nginx's default is 1m -- too small for real filing PDFs (a Morgan
    # Stanley 10-K was rejected with 413 at ~2MB, before ever reaching the
    # app). Real annual reports with embedded charts/images can run well
    # into the tens of MB, so set this generously rather than just past
    # the one file that happened to trigger this.
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"

spec:
  ingressClassName: nginx

  tls:
  - hosts:
    - investor-ai-platform.site
    secretName: invint-tls

  rules:
  - host: investor-ai-platform.site
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: invint
            port:
              number: 80
